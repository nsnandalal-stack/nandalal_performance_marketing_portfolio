<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f0e7">
<title>Nandalal | Interactive Portfolio</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f0e7;color:#172b3b;font-family:system-ui,sans-serif}
main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
.wrap{max-width:520px}.orb{width:52px;height:52px;border:2px solid #d8d3c8;border-top-color:#c9954d;border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 22px}
@keyframes spin{to{transform:rotate(360deg)}}h1{font:500 34px Georgia,serif;margin:0 0 10px}p{color:#5b6a70;line-height:1.6;font-size:14px}
</style></head>
<body><main id="loading"><div class="wrap"><div class="orb"></div><h1>Preparing your journey</h1><p>Loading the interactive portfolio and career spaces…</p></div></main>
<script>
(async()=>{
 try{
  const response=await fetch('./assets/site-payload.bin');
  if(!response.ok)throw new Error('Portfolio files were not found.');
  if(!('DecompressionStream' in window))throw new Error('Please use a recent browser version.');
  let html=await new Response(response.body.pipeThrough(new DecompressionStream('gzip'))).text();
  html=html.replaceAll('assets/nandalal-cutout.webp','assets/nandalal-avatar.jpg');
  html=html.replaceAll('assets/portfolio-collage.webp','assets/portfolio-collage.svg');
  document.open();document.write(html);document.close();
 }catch(error){
  document.getElementById('loading').innerHTML='<div class="wrap"><h1>Portfolio could not load</h1><p>'+String(error.message||error)+'</p><p>Refresh the page or use a current browser.</p></div>';
 }
})();
</script></body></html>
